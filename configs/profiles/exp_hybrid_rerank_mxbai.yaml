# L1 MAY row. Same index_sig as gpu_default nomic ingest. Fetch 20, rerank to 10.
retrieval:
  mode: hybrid
  hybrid_impl: client_side
  k_candidates: 20
  fusion:
    name: rrf
    params:
      k: 60
  reranker:
    name: cross_encoder
    params:
      model_id: mixedbread-ai/mxbai-rerank-xsmall-v1
      top_n: 10
      device: auto
      batch_size: 16
  query_transforms: [filter_extractor]
